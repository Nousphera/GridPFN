name: Verify submission
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest ruff
      - run: ruff check .
      - name: Data, artifact and original-physics contracts (no model credentials)
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '1'
          GRIDPFN_RELEASE_VERIFY: '1'
        run: python -m pytest -q tests/test_submission.py tests/test_release_evidence.py tests/test_make_release.py tests/test_energy_oracle.py tests/test_control_guidance.py tests/test_energy_scheduling.py
      - run: node --check site/performance.js
      - name: Foundation comparison contracts (mocked optional models)
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_foundation_study.py tests/test_foundation_audit.py tests/test_foundation_report.py tests/test_tabfm_backend.py tests/test_tabicl_backend.py tests/test_predictive_features.py
      - name: Package and chronological refit contracts
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '1'
        run: python -m pytest -q tests/test_package_layout.py tests/test_seasonal_refit.py tests/test_data_period.py tests/test_seasonal_study.py tests/test_seasonal_scheduler.py tests/test_full_report.py tests/test_finalize_study.py tests/test_deployment.py tests/test_oracle_period.py
