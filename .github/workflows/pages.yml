name: Publish project website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check release artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          assert 'Apache License' in Path('LICENSE').read_text()
          from gridpfn.release_evidence import load_evidence
          load_evidence('site/performance.json')
          PY
      - name: Prepare reviewed website assets
        run: python -m scripts.build_site --output "$RUNNER_TEMP/gridpfn-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/gridpfn-site
      - uses: actions/deploy-pages@v5
        id: deploy
