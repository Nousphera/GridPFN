name: Home assistant
on:
  push:
    paths: ['energy_assistant/**', 'hems_assistant.py', 'tests/test_energy_assistant.py', 'requirements-assistant.txt', '.github/workflows/assistant.yml']
  pull_request:
    paths: ['energy_assistant/**', 'hems_assistant.py', 'tests/test_energy_assistant.py', 'requirements-assistant.txt', '.github/workflows/assistant.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-assistant.txt pytest ruff
      - run: ruff check energy_assistant hems_assistant.py tests/test_energy_assistant.py scripts/assistant_demo
      - run: python -m pytest -q tests/test_energy_assistant.py tests/test_deployment.py
        env:
          CUDA_VISIBLE_DEVICES: ''
          OMP_NUM_THREADS: '1'
      - run: for script in energy_assistant/static/*.js; do node --check "$script"; done
