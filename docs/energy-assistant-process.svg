<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc">
<title id="title">GridPFN Home assistant</title><desc id="desc">A local Qwen or hosted language model routes your question to energy tools. Home readings feed TabPFN forecasts, explanations and a reused context cache. A saved personalized controller and simulator check appliance schedules. Evidence-backed answers return to the user; nothing controls real devices.</desc>
